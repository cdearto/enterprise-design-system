name: Check

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run tokens
      - name: The committed docs.js and tokens match their sources
        run: test -z "$(git status --porcelain components/_shared/docs.js tokens)" || { git status --short components/_shared/docs.js tokens; exit 1; }
